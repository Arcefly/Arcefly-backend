# ===== DATOS DE CONEXIÓN PRINCIPAL =====
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.enabled=false
# ===== JPA/HIBERNATE =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# ===== CONFIGURACIÓN DEL SERVIDOR =====
server.port=${PORT:8080}
# ===== CONFIGURACIÓN DE CORREO (API de Brevo, no SMTP) =====
brevo.api.key=${BREVO_API_KEY}
brevo.remitente.email=arceflyy@gmail.com
brevo.remitente.nombre=Arcefly
# CORS Configuration
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.web.cors.allowed-origins=https://arcefly.netlify.app,http://localhost:4200
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true